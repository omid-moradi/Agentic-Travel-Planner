[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-planner"
version = "0.1.0"
description = "Agentic travel planner for domestic Iran and international trips (fa/en)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
  "langgraph>=1.2,<2",
  "langgraph-checkpoint>=4.2,<5",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.1,<2",
  "httpx>=0.28,<1",
  "openai>=1.100,<2",
]

[project.optional-dependencies]
# Scraping-first data providers (phase 3)
providers = [
  "selectolax>=0.3.21",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
]
search = [
  "tavily-python>=0.7,<1",
]
# API and persistence (phase 4)
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "pip-audit>=2.7",
]
all = [
  "travel-planner[providers,search,api,dev]",
]

[project.scripts]
travel-planner = "travel_planner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
travel_planner = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # function call in default argument (FastAPI Depends)
  "SIM108",  # ternary - often less readable in this codebase
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Persian UI copy legitimately contains Arabic-script characters.
"src/travel_planner/graph/nodes/writer.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["travel_planner"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tavily.*", "selectolax.*", "bs4.*", "lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "asyncio: mark test as asyncio",
  "live: opt-in test that calls a real external provider",
  "slow: long-running test",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/travel_planner"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
